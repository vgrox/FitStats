services:
  - type: web
    name: fitstats
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm run start:hosted
    healthCheckPath: /health
    disk:
      name: fitstats-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FITSTATS_DB_PATH
        value: /var/data/fitstats.db
      - key: FITSTATS_DASHBOARD_PASSWORD
        generateValue: true
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: STRAVA_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: STRAVA_WEBHOOK_CALLBACK_URL
        sync: false
